plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adshield'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adshield'
        minSdk 26
        targetSdk 35
        // CI build number, so each new build installs as an update.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // Every build must be signed with the same key, or Android refuses to install it as
        // an update ("App not installed"). This key is committed so CI builds always match.
        // It's public, so only install AdShield from this repo's Releases page.
        // To use a private key instead, set KEYSTORE_FILE and friends (e.g. GitHub secrets).
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {
                storeFile file('adshield.jks')
                storePassword 'adshield'
                keyAlias 'adshield'
                keyPassword 'adshield'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
